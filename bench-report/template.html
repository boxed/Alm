<title>alm — benchmarks</title>
<style>
  :root {
    --bg: #fbfbfc; --panel: #ffffff; --ink: #1a1e26; --ink-soft: #566072; --ink-faint: #8a93a3;
    --line: #e7e9ef; --line-strong: #d3d7e0; --track: #eef0f4;
    --stale-bg: #fdf3e0; --stale-ink: #8a5d00; --stale-line: #e8cf9a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a21; --ink: #e8ebf1; --ink-soft: #a2abbb; --ink-faint: #6b7484;
      --line: #232935; --line-strong: #2e3542; --track: #1e2430;
      --stale-bg: #2e2413; --stale-ink: #e0b558; --stale-line: #5a4620;
    }
  }
  :root[data-theme="light"] {
    --bg: #fbfbfc; --panel: #ffffff; --ink: #1a1e26; --ink-soft: #566072; --ink-faint: #8a93a3;
    --line: #e7e9ef; --line-strong: #d3d7e0; --track: #eef0f4;
    --stale-bg: #fdf3e0; --stale-ink: #8a5d00; --stale-line: #e8cf9a;
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161a21; --ink: #e8ebf1; --ink-soft: #a2abbb; --ink-faint: #6b7484;
    --line: #232935; --line-strong: #2e3542; --track: #1e2430;
    --stale-bg: #2e2413; --stale-ink: #e0b558; --stale-line: #5a4620;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
         line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }

  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 26px; }
  h1 { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.15; margin: 0 0 8px;
       letter-spacing: -.02em; font-weight: 680; }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin: 0; }

  .scale { display: flex; align-items: center; gap: 10px; margin-top: 16px;
           font-size: 12px; color: var(--ink-faint); font-family: var(--mono); }
  .scale .grad { width: 160px; height: 9px; border: 1px solid var(--line-strong); flex: none;
    background: linear-gradient(to right, rgb(55,168,119), rgb(215,168,58), rgb(221,97,85)); }

  section { margin-bottom: 40px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between;
              gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  h2 { font-size: 16px; letter-spacing: -.01em; margin: 0; font-weight: 640; }
  .sec-link { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
              text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .sec-link:hover { color: var(--ink); }
  .caption { font-size: 12px; font-family: var(--mono); color: var(--ink-faint);
             margin: 20px 0 6px; }
  .facts { font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
           margin: 0 0 10px; }

  .stamp { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--line-strong); color: var(--ink-faint); white-space: nowrap; }
  .stamp.stale, .stamp.missing { background: var(--stale-bg); color: var(--stale-ink);
                                 border-color: var(--stale-line); }

  .tbl-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 7px 12px;
             border-bottom: 1px solid var(--line-strong); color: var(--ink-faint); }
  th.op { text-align: left; width: 22%; }
  th.grp { text-align: center; color: var(--ink); border-left: 2px solid var(--line-strong); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.op { text-align: left; font-size: 14px; color: var(--ink); font-weight: 520;
          white-space: nowrap; }
  td.c-num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums;
             font-size: 13px; color: var(--ink-soft); white-space: nowrap;
             border-left: 2px solid var(--line-strong); padding-right: 5px; }
  td.c-num.best { color: var(--ink); font-weight: 680; }
  td.c-num.na { color: var(--ink-faint); font-weight: 400; }
  td.c-star { width: 14px; text-align: center; color: #d9a441; font-size: 11px;
              padding-left: 7px; padding-right: 4px; }
  td.c-bar { width: 52px; min-width: 52px; padding-left: 6px; padding-right: 2px; }
  .heat { display: block; width: 100%; height: 9px; background: var(--track);
          border: 1px solid var(--line-strong); overflow: hidden; }
  .heatfill { display: block; height: 100%; min-width: 2px; }

  .absent { color: var(--ink-faint); font-style: italic; padding: 10px 0; font-size: 13px; }
</style>

<div class="wrap"><div id="report"></div></div>

<script>
  // This file is presentation only: CSS and the renderer below. Every word the
  // page displays — titles, column headers, dates, the facts line — comes from
  // DATA, which generate.py builds from the harnesses' results.json.
  //
  // Do not add authored copy here. Prose describing measurements goes stale the
  // moment a benchmark is re-run, and this report has already been through
  // that: it ended up describing numbers it was no longer showing.
  const DATA = /*{{DATA}}*/;

  const GOOD = [55, 168, 119], AMBER = [215, 168, 58], BAD = [221, 97, 85];
  const mix = (a, b, u) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * u));
  function heatColor(ratio) {
    const t = Math.min(1, Math.max(0, (ratio - 1) / 2));
    const c = t <= 0.5 ? mix(GOOD, AMBER, t / 0.5) : mix(AMBER, BAD, (t - 0.5) / 0.5);
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  /** Rows down, one column per thing measured; the bar is a share of the row's best. */
  function table(spec) {
    if (!spec.rows || !spec.rows.length) return el("p", "absent", "No results.");
    const t = document.createElement("table");
    const head = t.createTHead().insertRow();
    head.appendChild(el("th", "op", spec.label || "operation"));
    for (const c of spec.columns) {
      const th = el("th", "grp", c);
      th.colSpan = 3;
      head.appendChild(th);
    }
    const body = t.createTBody();
    for (const row of spec.rows) {
      const tr = body.insertRow();
      tr.appendChild(el("td", "op", row.op));
      const values = spec.columns.map(c => row[c]).filter(v => v != null);
      const best = values.length ? Math.min(...values) : null;
      for (const c of spec.columns) {
        const v = row[c];
        if (v == null) {
          tr.appendChild(el("td", "c-num na", "n/a"));
          tr.appendChild(el("td", "c-bar"));
          tr.appendChild(el("td", "c-star"));
          continue;
        }
        tr.appendChild(el("td", "c-num" + (v === best ? " best" : ""),
                          v.toFixed(spec.decimals) + (spec.unit ? " " + spec.unit : "")));
        const bar = el("td", "c-bar");
        const heat = el("span", "heat");
        const fill = el("span", "heatfill");
        fill.style.width = (best / v * 100).toFixed(1) + "%";
        fill.style.background = heatColor(v / best);
        heat.appendChild(fill);
        bar.appendChild(heat);
        tr.appendChild(bar);
        tr.appendChild(el("td", "c-star", v === best ? "★" : ""));
      }
    }
    const scroll = el("div", "tbl-scroll");
    scroll.appendChild(t);
    return scroll;
  }

  const root = document.getElementById("report");
  const header = document.createElement("header");
  header.appendChild(el("h1", null, DATA.title));
  header.appendChild(el("p", "eyebrow", DATA.generated));
  const scale = el("div", "scale");
  scale.appendChild(el("span", null, "at best"));
  scale.appendChild(el("span", "grad"));
  scale.appendChild(el("span", null, "3x or slower"));
  header.appendChild(scale);
  root.appendChild(header);

  for (const s of DATA.sections) {
    const sec = document.createElement("section");
    const head = el("div", "sec-head");
    const title = el("div");
    title.style.cssText = "display:flex;align-items:baseline;gap:10px;flex-wrap:wrap";
    title.appendChild(el("h2", null, s.title));
    if (s.link) {
      const a = el("a", "sec-link", s.link.text);
      a.href = s.link.href;
      a.rel = "noreferrer";
      a.target = "_blank";
      title.appendChild(a);
    }
    head.appendChild(title);
    head.appendChild(el("span", "stamp " + s.freshness.state, s.freshness.note));
    sec.appendChild(head);
    if (s.facts) sec.appendChild(el("p", "facts", s.facts));
    for (const tbl of s.tables) {
      if (tbl.caption) sec.appendChild(el("p", "caption", tbl.caption));
      sec.appendChild(table(tbl));
      // Why a cell reads n/a, so a blank is never left to be guessed at.
      for (const note of tbl.notes || []) sec.appendChild(el("p", "facts", note));
    }
    root.appendChild(sec);
  }
</script>
